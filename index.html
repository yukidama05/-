<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>探索者名鑑全集</title><style>
:root{color-scheme:dark;--gold:#ddc38b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{background:radial-gradient(ellipse at 50% 20%,#654832,#231916 65%,#100e0e);color:#f4e8d4;font-family:Georgia,'Yu Mincho','Hiragino Mincho ProN',serif}.viewer{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:stretch;overflow:hidden;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 8px)}.controls{flex:0 0 46px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:0}.btn{border:1px solid #9d8054;background:#35251d;color:#f4e0b9;padding:9px 10px;border-radius:6px;font:inherit;font-size:12px;cursor:pointer;min-height:38px}.btn:disabled{opacity:.28}.folio{font-size:12px;color:#d0baa0;text-align:center}.stage-wrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}.bookstage{position:relative;width:min(calc(100vw - 28px),calc((100dvh - 118px)*0.75),480px);max-height:100%;aspect-ratio:3/4;perspective:1400px;filter:drop-shadow(8px 10px 11px #0008);touch-action:pan-x}.page{position:absolute;inset:0;transform-origin:left center;backface-visibility:hidden;transition:transform .52s ease,opacity .52s ease;overflow:hidden;background:#efe1c4;border-radius:3px 8px 8px 3px;box-shadow:inset 9px 0 12px #0003}.page img{width:100%;height:100%;object-fit:contain;display:block}.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;padding:22px;background:linear-gradient(90deg,#1a0e0b,#765133 17%,#2c1b17 70%,#100b09);border:5px double #d6b477;color:#f2d7a4}.cover strong{font-size:clamp(27px,7vw,42px);letter-spacing:.12em}.cover em{font-size:12px;font-style:normal}.cover hr{border:0;background:#d6b477;width:65%;height:1px}.paper{padding:clamp(17px,5vw,34px);background:linear-gradient(110deg,#e7d5af,#fff1d2 17%,#f1e0bf);color:#4a3326;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start}.paper h2{text-align:center;font-weight:500;letter-spacing:.22em;font-size:clamp(20px,5vw,29px);margin:8px 0 14px}.paper p{font-size:clamp(12px,3vw,15px);line-height:1.9;margin:9px 0}.ornament{text-align:center;color:#96764e;font-size:12px;letter-spacing:.25em}.paper .rule{height:1px;background:#bea579;margin:10px 0}.toclist{display:flex;flex-direction:column;gap:4px;min-height:0}.toclink{border:0;border-bottom:1px dotted #b5a080;background:transparent;color:#4a3326;display:flex;align-items:center;gap:8px;text-align:left;padding:9px 2px;font:inherit;font-size:clamp(12px,3.2vw,16px);cursor:pointer}.toclink .number{font-size:11px;color:#907251}.toclink .dots{flex:1;border-bottom:1px dotted #c7b494}.toclink:active{background:#dfc99f}.pagefoot{margin-top:auto;text-align:center;color:#96764e;font-size:11px}.flipout{transform:rotateY(-95deg);opacity:.35}.flipin{transform:rotateY(88deg);transition:none}.flipin.reveal{transition:transform .52s ease,opacity .52s ease;transform:rotateY(0)}.flipout-back{transform-origin:right center;transform:rotateY(95deg);opacity:.35}.flipin-back{transform-origin:right center;transform:rotateY(-88deg);transition:none}.flipin-back.reveal{transition:transform .52s ease,opacity .52s ease;transform:rotateY(0)}.credits{justify-content:center;gap:7px;text-align:center}.credits h2{margin:3px 0}.credits .staff{width:100%;max-height:42%;object-fit:contain;border:2px solid #b99a69;border-radius:3px}.credits .motto{font-size:clamp(11px,2.7vw,14px);line-height:1.65;margin:2px 0}.credits .by{font-size:clamp(11px,2.8vw,14px);font-weight:bold}.overlay{position:fixed;z-index:10;inset:0;background:#0e0b09a8;display:none;align-items:center;justify-content:center;padding:16px}.overlay.show{display:flex}.overlaypanel{width:min(100%,420px);max-height:85dvh;overflow:auto;background:#f1e1c2;color:#4a3326;border:4px double #aa8a5e;padding:20px;border-radius:6px}.overlaypanel h2{text-align:c </style></head><body><main class="viewer" aria-label="探索者名鑑全集"><div class="controls"><button class="btn" id="first">表紙へ</button><span class="folio">探索者名鑑全集</span><button class="btn" id="tocButton">目次</button></div><div class="stage-wrap"><div class="bookstage" id="stage" aria-label="本のページ"></div></div><div class="controls"><button class="btn" id="prev">← 前のページ</button><span class="folio" id="folio"></span><button class="btn" id="next">次のページ →</button></div></main><div class="overlay" id="overlay"><div class="overlaypanel"><h2>目　次</h2><div id="quicktoc"></div><button class="btn" id="closeOverlay">閉じる</button></div></div><script id="catalog" type="application/json">[{"id":"001","name":"羽鳥 暗黎","short":"暗黎","color":"#8b2836","pages":[{"id":"profile","title":"PROFILE","src":"001-profile.jpg"},{"id":"scenario-history","title":"SCENARIO HISTORY","src":"001-scenario-history.jpg"}]},{"id":"002","name":"朱雀","short":"朱雀","color":"#b96583","pages":[{"id":"profile","title":"PROFILE","src":"002-profile.jpg"},{"id":"scenario-history","title":"SCENARIO HISTORY","src":"002-scenario-history.jpg"}]},{"id":"003","name":"神田 一月","short":"一月","color":"#8464a9","pages":[{"id":"profile","title":"PROFILE","src":"003-profile.jpg"},{"id":"scenario-history","title":"SCENARIO HISTORY","src":"003-scenario-history.jpg"}]},{"id":"004","name":"オズワルド","short":"オズワルド","color":"#b77a43","pages":[{"id":"profile","title":"PROFILE","src":"004-profile.jpg"},{"id":"scenario-history","title":"SCENARIO HISTORY","src":"004-scenario-history.jpg"}]},{"id":"005","name":"メアリー","short":"メアリー","color":"#b4bd36","pages":[{"id":"profile","title":"PROFILE","src":"005-profile.jpg"},{"id":"scenario-history","title":"SCENARIO HISTORY","src":"005-scenario-history.jpg"}]},{"id":"006","name":"アシュリー","short":"アシュリー","color":"#366d9b","pages":[{"id":"profile","title":"PROFILE","src":"006-profile.jpg"},{"id":"scenario-history","title":"SCENARIO HISTORY","src":"006-scenario-history.jpg"}]},{"id":"007","name":"穂村佑哉","short":"穂村","color":"#0F5779","pages":[{"id":"profile","title":"PROFILE","src":"007-profile.jpg"},{"id":"scenario-history","title":"SCENARIO HISTORY","src":"007-scenario-history.jpg"}]},{"id":"008","name":"穂村佑佳","short":"佑佳","color":"#E99A9C","pages":[{"id":"profile","title":"PROFILE","src":"008-profile.jpg"},{"id":"scenario-history","title":"SCENARIO HISTORY","src":"008-scenario-history.jpg"}]},{"id":"009","name":"外谷舞桜","short":"舞桜","color":"#B28B90","pages":[{"id":"profile","title":"PROFILE","src":"009-profile.jpg"},{"id":"scenario-history","title":"SCENARIO HISTORY","src":"009-scenario-history.jpg"}]}]</script><script>
const entries=JSON.parse(document.getElementById('catalog').textContent),$=id=>document.getElementById(id),PAGE_SIZE=8;let current=0,busy=false,sequence=[];const tocCount=Math.ceil(entries.length/PAGE_SIZE);sequence.push({kind:'cover'},{kind:'intro'});for(let i=0;i<tocCount;i++)sequence.push({kind:'toc',chunk:i});for(const e of entries)for(const p of e.pages)sequence.push({kind:'image',entry:e,page:p});sequence.push({kind:'credits'});const firstPageOf=id=>sequence.findIndex(x=>x.kind==='image'&&x.entry.id===id);function el(tag,cls,txt){const d=document.createElement(tag);if(cls)d.className=cls;if(txt!==undefined)d.textContent=txt;return d}function tocLink(e){const b=el('button','toclink');b.type='button';b.append(el('span','number','No.'+e.id),el('span','',e.name),el('span','dots'),el('span','','›'));b.addEventListener('click',()=>{closeOverlay();jump(firstPageOf(e.id))});return b}function createPage(n){const obj=sequence[n],d=el('div','page');if(obj.kind==='image'){const img=el('img');img.src=obj.page.src;img.alt=obj.entry.name+' '+obj.page.title;d.append(img)}else if(obj.kind==='cover'){d.classList.add('cover');d.append(el('em','','CALL OF CTHULHU TRPG'),el('strong','','探索者名鑑'),el('hr'),el('em','','探索者全集｜全'+entries.length+'名'))}else if(obj.kind==='intro'){d.classList.add('paper');d.append(el('div','ornament','✦ EXPLORER ARCHIVES ✦'),el('h2','','はじめに'),el('div','rule'),el('p','','この一冊には、探索者たちのプロフィールと、歩んできたシナリオの記録を収めています。'),el('p','','左右にページをめくり、気になる探索者との出会いをお楽しみください。'),el('p','','目次にある名前を押すと、その探索者の最初のページへ移動できます。'),el('p','','画面右上の「目次」から、いつでも探し直すことができます。'),el('div','pagefoot','— 探索者名鑑作成部門 —'))}else if(obj.kind==='toc'){d.classList.add('paper');d.append(el('div','ornament','✦ CONTENTS ✦'),el('h2','','目　次'));const list=el('div','toclist');entries.slice(obj.chunk*PAGE_SIZE,(obj.chunk+1)*PAGE_SIZE).forEach(e=>list.append(tocLink(e)));d.append(list,el('div','pagefoot','目次 '+(obj.chunk+1)+' / '+tocCount))}else if(obj.kind==='credits'){d.classList.add('paper','credits');d.append(el('div','ornament','✦ COLOPHON ✦'),el('h2','','制作後記・奥付'));const img=el('img','staff');img.src='staff-photo.jpg';img.alt='探索者名鑑作成部門・集合写真';d.append(img,el('div','motto','身長は慎重に！\n判断は真剣に！\n社員は珍妙に！\nデザインは華麗に！'),el('div','rule'),el('div','by','作成：株式会社ちゃっぴー\n探索者名鑑作成部門'));d.querySelector('.motto').style.whiteSpace='pre-line';d.querySelector('.by').style.whiteSpace='pre-line'}return d}function render(){const stage=$('stage');stage.replaceChildren(createPage(current));$('folio').textContent=(current+1)+' / '+sequence.length;$('prev').disabled=current===0;$('next').disabled=current===sequence.length-1}function jump(n){if(busy||n<0||n>=sequence.length||n===current)return;busy=true;const old=$('stage').firstElementChild,up=createPage(n);const backwards=n<current;up.classList.add(backwards?'flipin-back':'flipin');$('stage').append(up);requestAnimationFrame(()=>requestAnimationFrame(()=>{old.classList.add(backwards?'flipout-back':'flipout');up.classList.add('reveal')}));setTimeout(()=>{current=n;busy=false;render()},570)}function closeOverlay(){$('overlay').classList.remove('show')}entries.forEach(e=>$('quicktoc').append(tocLink(e)));$('tocButton').addEventListener('click',()=>$('overlay').classList.add('show'));$('closeOverlay').addEventListener('click',closeOverlay);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeOverlay()});$('first').addEventListener('click',()=>jump(0));$('next').addEventListener('click',()=>jump(current+1));$('prev').addEventListener('click',()=>jump(current-1));let sx=0,sy=0;$('stage').addEventListener('touchstart',e=>{sx=e.changedTouches[0].screenX;sy=e.changedTouches[0].screenY},{passive:true});$('stage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-sx,dy=e.changedTouches[0].screenY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))jump(current+(dx<0?1:-1))},{passive:true});document.addEventListener('keydown',e=>{if($('overlay').classList.contains('show')){if(e.key==='Escape')closeOverlay();return}if(e.key==='ArrowRight')jump(current+1);if(e.key==='ArrowLeft')jump(current-1)});render();
</script></body></html>
